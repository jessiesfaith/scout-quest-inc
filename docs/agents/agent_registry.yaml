  GATE-authz:    {implemented_as: registry lookup,       owner: security-compliance, change_class: 3, status: specified}
  GATE-contract: {implemented_as: json-schema validation,owner: engineering,         change_class: 2, status: specified}
  GATE-runtime:  {implemented_as: counters + allowlists, owner: engineering,         change_class: 3, status: specified}
  GATE-release:  {implemented_as: static artifact scan,  owner: security-compliance, change_class: 3, status: specified}
