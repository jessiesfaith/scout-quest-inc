  marketing_monthly_cap_usd:  130.00   # 5 specs; all blocked on CHG-001
  product_monthly_cap_usd:     80.00   # 3 specs
  total_declared_ceiling_usd: 420.00
  enabled_today_ceiling_usd:  260.00   # only enabled: true entries (9 agents)
  note: >
    Per Constitution 3.3 every WORKFLOW must declare a monthly budget before
    activation. These are per-AGENT caps. Workflow budgets are declared in the
    work order and are not yet written. Thresholds per 5.2: 80% warn,
    100% hard cutoff, >120% review, >150% suspension. No agent may raise its
    own cap.
