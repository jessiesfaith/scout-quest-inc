# Scout Quest Enterprise — Agent Registry
#
# The machine-readable index of the agent library. One entry per specification in
# docs/agents/**. Governed by the Enterprise Constitution v1.4.
#
# ---------------------------------------------------------------------------
# RECONCILIATION REQUIRED BEFORE ANY INGEST RUN
# ---------------------------------------------------------------------------
# The `agents` table in the Company OS is ingest-owned: readAgents() in
# scripts/ingest/sources.mjs reads config/spend_policy.yaml from the asl-gateway
# repo, and ingest_agents() (migration 0015) upserts on agent_id with
# source = 'spend-policy'.
#
# asl-gateway was NOT a connected folder in the session that wrote this file, so
# the six agents already in spend_policy.yaml have not been reconciled against
# these entries. Two consequences:
#
#   1. Do not hand-seed these rows into `agents`. The next ingest would overwrite
#      them, or worse, half of them.
#   2. Activating an agent here means adding it to spend_policy.yaml with the same
#      agent_id, caps, data_classes, and registry class. THAT file is what the
#      Company OS mirrors. This file is the governance source of truth; that file
#      is the operational one, and they must agree.
#
# Fields below match the INPUT shape readAgents() expects — that is, spend_policy.yaml
# itself — so an entry can be transcribed across without translation. (readAgents()'s
# OUTPUT differs: it adds a `role` field and comma-joins data_classes and
# allowed_models into strings.) Fields prefixed `sq_` are governance metadata that
# neither spend_policy.yaml nor the ingest reads.
#
# Change class to modify this file: Class 2 (an entry) · Class 3 (a status change
# to active, a cap change, or a data_classes change).

